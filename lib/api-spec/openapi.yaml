openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /nest/paste-drafts/{membershipId}/{kind}:
    parameters:
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [groceries, chores] } }
    get:
      operationId: getNestPasteDraft
      responses:
        "200":
          description: Account-private draft, or a revisioned empty slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestPasteDraft" }
        "401": { description: Sign in required }
        "403": { description: Membership unavailable }
    put:
      operationId: putNestPasteDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NestPasteDraftInput" }
      responses:
        "200":
          description: Draft checkpoint or discard committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestPasteDraft" }
        "400": { description: Invalid draft }
        "401": { description: Sign in required }
        "403": { description: Membership unavailable }
        "409": { description: Draft changed; load latest before continuing }
  /nest/paste-drafts/{membershipId}/{kind}/save:
    parameters:
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [groceries, chores] } }
    post:
      operationId: saveNestPasteDraftRow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NestPasteRowInput" }
      responses:
        "200":
          description: Record and remaining draft committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestPasteDraft" }
        "400": { description: Invalid reviewed row }
        "401": { description: Sign in required }
        "403": { description: Membership unavailable }
        "409": { description: Draft changed; no item sent }
  /nest/attachments:
    post:
      operationId: uploadNestJournalAttachment
      summary: Stage a private journal attachment
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Private staged file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestJournalAttachment" }
        "400": { description: Invalid or empty file }
        "401": { description: Sign in required }
        "403": { description: Household membership required }
        "413": { description: File exceeds 10 MB }
        "415": { description: Unsupported file type }
        "429": { description: Too many unsaved files }
  /nest/attachments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getNestJournalAttachment
      summary: Read a file after checking the current journal visibility
      responses:
        "200":
          description: Authorized file bytes; only raster images may display inline
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "404": { description: File unavailable }
    delete:
      operationId: discardNestJournalAttachment
      summary: Idempotently discard an own staged upload; saved attachments are untouched
      responses:
        "204": { description: Draft cleanup finished }
        "401": { description: Sign in required }
        "404": { description: Invalid ID or no household }
  /nest/attachments/{id}/download:
    get:
      operationId: downloadNestJournalAttachment
      summary: Download an authorized attachment, including raster images
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized file download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "404": { description: File unavailable }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /nest/snapshot:
    get:
      operationId: getNestSnapshot
      responses:
        "200":
          description: Authorized household data only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestSnapshot" }
        "404": { description: No household linked }
        "401": { description: Sign-in required }
  /nest/notifications/read:
    patch:
      operationId: markNestNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NestNotificationReadInput"
      responses:
        "204": { description: Updates marked as read for this account }
  /nest/households:
    post:
      operationId: createNestHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HouseholdInput" }
      responses:
        "201":
          description: Created household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestResult" }
  /nest/join:
    post:
      operationId: joinNestHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptance" }
      responses:
        "200":
          description: Joined as the role assigned to the invited profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestResult" }
  /nest/invitations:
    post:
      operationId: createNestInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NestInvitationInput" }
      responses:
        "201":
          description: Single-use invitation bound to one unlinked household profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestInvitation" }
        "400": { description: Invalid invitation target }
        "403": { description: Parent access required }
        "409": { description: Profile already linked }
  /nest/members:
    post:
      operationId: createNestMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NestMemberInput" }
      responses:
        "201":
          description: Created unlinked household profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestMember" }
        "400": { description: Invalid profile name or role }
        "403": { description: Parent access required }
  /nest/records:
    post:
      operationId: createNestRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NestRecordInput" }
      responses:
        "201":
          description: Created record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestRecordResult" }
  /nest/records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateNestRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NestRecordUpdate" }
      responses:
        "200":
          description: Updated authorized record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestRecordResult" }
    delete:
      operationId: deleteNestRecord
      responses:
        "204": { description: Deleted authorized record }
  /nest/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateNestMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NestMemberUpdate" }
      responses:
        "200":
          description: Updated household profile or own tracking label
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestResult" }
        "400": { description: Invalid profile update }
        "403": { description: Parent access required for profile and role changes }
        "404": { description: Profile unavailable }
        "409": { description: The household must retain at least one parent }
    delete:
      operationId: deleteNestMember
      responses:
        "204": { description: Profile access revoked; private content stays private and existing records are retained }
        "403": { description: Parent access required }
        "404": { description: Profile unavailable }
        "409": { description: The household must retain at least one parent }
components:
  schemas:
    NestPasteRow:
      type: object
      additionalProperties: false
      required: [id, title, quantity, assignedTo, cadence, dueDate]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, maxLength: 1000 }
        quantity: { type: string, maxLength: 1000 }
        assignedTo: { type: string, maxLength: 100 }
        cadence: { type: string, maxLength: 100 }
        dueDate: { type: string, maxLength: 100 }
        isPaid: { type: boolean }
        payAmount: { type: string, maxLength: 100 }
    NestPasteSession:
      type: object
      additionalProperties: false
      required: [text, drafts, reviewing, savedCount, showErrors, error, uncertainId, finished]
      properties:
        text: { type: string, maxLength: 20000 }
        drafts:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/NestPasteRow" }
        reviewing: { type: boolean }
        savedCount: { type: integer, minimum: 0, maximum: 100000 }
        showErrors: { type: boolean }
        error: { type: string, maxLength: 2000 }
        uncertainId: { type: [string, "null"], maxLength: 100 }
        finished: { type: boolean }
    NestPasteDraft:
      type: object
      required: [revision, session]
      properties:
        revision: { type: [string, "null"], format: uuid }
        session:
          oneOf:
            - { $ref: "#/components/schemas/NestPasteSession" }
            - { type: "null" }
    NestPasteDraftInput:
      type: object
      additionalProperties: false
      required: [revision, session]
      properties:
        revision: { type: [string, "null"], format: uuid }
        session:
          oneOf:
            - { $ref: "#/components/schemas/NestPasteSession" }
            - { type: "null" }
    NestPasteRowInput:
      type: object
      additionalProperties: false
      required: [revision, rowId]
      properties:
        revision: { type: string, format: uuid }
        rowId: { type: string, minLength: 1, maxLength: 100 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    HouseholdInput:
      type: object
      additionalProperties: false
      required: [name, parentName, childName]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentName: { type: string, minLength: 1, maxLength: 80 }
        childName: { type: string, minLength: 1, maxLength: 80 }
    InvitationAcceptance:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 32, maxLength: 32 }
    NestResult:
      type: object
      required: [id]
      properties:
        id: { type: string }
    NestInvitation:
      type: object
      required: [code, expiresAt, memberId]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        memberId: { type: string, format: uuid }
    NestInvitationInput:
      type: object
      additionalProperties: false
      required: [memberId]
      properties:
        memberId: { type: string, format: uuid }
    NestRecordInput:
      type: object
      additionalProperties: false
      required: [kind, data]
      properties:
        kind:
          type: string
          enum: [chores, allowance, events, money, budgetPlans, schoolTasks, goals, journal, groceries, groceryFavorites, journalReplies]
        data: { type: object, additionalProperties: true }
    NestRecordUpdate:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }
    NestRecordResult:
      type: object
      required: [id]
      properties:
        id: { type: string }
        allowanceEntry: { $ref: "#/components/schemas/NestAllowanceEntry" }
    NestChore:
      type: object
      required: [id, title, assignedTo, cadence, dueDate, done, isPaid, payAmount, allowanceRecorded]
      properties:
        id: { type: string }
        title: { type: string }
        assignedTo: { type: string, description: "Household member UUID or household for a shared chore" }
        cadence: { type: string, enum: [Once, Daily, Weekdays, Weekly] }
        dueDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        done: { type: boolean }
        isPaid: { type: boolean }
        payAmount: { type: number, minimum: 0, maximum: 10000000 }
        completedOn: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        allowanceRecorded: { type: boolean, readOnly: true }
    NestAllowanceEntry:
      type: object
      required: [id, title, amount, date, status]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: number }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        status: { type: string, enum: [earned, paid] }
    NestMemberUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        avatarId: { type: string, pattern: "^(animals|bugs|reptiles)-(0[1-9]|1[0-2])-[ab]$" }
        trackingLabel: { type: string, minLength: 1, maxLength: 80 }
        role: { type: string, enum: [parent, child, householdMember] }
    NestMemberInput:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        role: { type: string, enum: [parent, child, householdMember] }
    NestMember:
      type: object
      required: [id, name, role, avatarId, linked, trackingLabel]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [parent, child, householdMember] }
        avatarId: { type: string }
        trackingLabel: { type: string }
        linked: { type: boolean }
    NestItem:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id: { type: string }
    NestJournalMood:
      type: string
      enum: [happy, sad, hopeful, nervous, calm, excited, grateful, tired, frustrated, overwhelmed, lonely, neutral]
    NestJournalAttachment:
      type: object
      additionalProperties: false
      required: [id, name, contentType, size]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        contentType: { type: string }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    NestJournalEntry:
      type: object
      additionalProperties: false
      required: [id, promptId, authorId, body, createdAt, shared]
      properties:
        id: { type: string }
        promptId: { type: string, enum: [p1, p2, p3, p4] }
        authorId: { type: string }
        body: { type: string, maxLength: 20000 }
        attachmentIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/NestJournalAttachment" }
        createdAt: { type: string, format: date-time }
        shared: { type: boolean }
        mood:
          oneOf:
            - { $ref: "#/components/schemas/NestJournalMood" }
            - { type: "null" }
    NestGroceryItem:
      type: object
      additionalProperties: false
      required: [id, title, quantity, done]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 300 }
        quantity: { type: string, maxLength: 100 }
        done: { type: boolean }
    NestJournalReply:
      type: object
      additionalProperties: false
      required: [id, entryId, body, authorId, createdAt]
      properties:
        id: { type: string }
        entryId: { type: string, format: uuid }
        body: { type: string, minLength: 1, maxLength: 5000 }
        authorId: { type: string }
        createdAt: { type: string, format: date-time }
    NestGroceryFavorite:
      type: object
      additionalProperties: false
      required: [id, title, quantity]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 300 }
        quantity: { type: string, maxLength: 100 }
    NestNotification:
      type: object
      additionalProperties: false
      required: [id, actorId, summary, targetPath, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        summary: { type: string, maxLength: 600 }
        targetPath: { type: string }
        createdAt: { type: string, format: date-time }
        readAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    NestNotificationReadInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
    NestSnapshot:
      type: object
      required: [householdName, activeId, role, members, chores, allowance, events, schoolTasks, goals, journal, groceries, groceryFavorites, journalReplies, notifications, budgetPlans]
      properties:
        householdName: { type: string }
        activeId: { type: string }
        role: { type: string, enum: [parent, child, householdMember] }
        members:
          type: array
          items: { $ref: "#/components/schemas/NestMember" }
        chores:
          type: array
          items: { $ref: "#/components/schemas/NestChore" }
        allowance:
          type: array
          items: { $ref: "#/components/schemas/NestAllowanceEntry" }
        events:
          type: array
          items: { $ref: "#/components/schemas/NestItem" }
        money:
          type: array
          items: { $ref: "#/components/schemas/NestItem" }
        budgetPlans:
          type: array
          items: { $ref: "#/components/schemas/NestBudgetPlan" }
        schoolTasks:
          type: array
          items: { $ref: "#/components/schemas/NestItem" }
        goals:
          type: array
          items: { $ref: "#/components/schemas/NestItem" }
        journal:
          type: array
          items: { $ref: "#/components/schemas/NestJournalEntry" }
        journalReplies:
          type: array
          items: { $ref: "#/components/schemas/NestJournalReply" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/NestNotification" }
        groceries:
          type: array
          items: { $ref: "#/components/schemas/NestGroceryItem" }
        groceryFavorites:
          type: array
          items: { $ref: "#/components/schemas/NestGroceryFavorite" }
    NestBudgetCategory:
      type: object
      additionalProperties: false
      required: [category, amount]
      properties:
        category: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: number, minimum: 0.01, maximum: 10000000 }
        note: { type: string, maxLength: 160 }
    NestBudgetPlan:
      type: object
      additionalProperties: false
      required: [id, month, incomeTarget, savingsTarget, note, categories]
      properties:
        id: { type: string }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
        incomeTarget: { type: number, minimum: 0, maximum: 10000000 }
        savingsTarget: { type: number, minimum: 0, maximum: 10000000 }
        note: { type: string, maxLength: 400 }
        categories:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/NestBudgetCategory" }

